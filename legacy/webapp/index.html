<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모먼트 카페 · 키오스크</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="./">moment<span>COFFEE & EVERYDAY</span></a><div class="practice">● 키오스크 체험 모드</div></header>
<main><section class="catalog"><div class="intro"><p class="eyebrow">A LITTLE MOMENT FOR YOU</p><h1>오늘의 작은 쉼표,<br>어떤 메뉴와 함께할까요?</h1><p>좋아하는 메뉴를 골라 나만의 순간을 만들어보세요.</p><div class="notice">실제 결제가 이루어지지 않는 주문 연습 공간입니다.</div></div><nav aria-label="메뉴 카테고리" id="categories"></nav><div class="menu-grid" id="menu"></div></section>
<aside><div class="order-title"><h2>나의 주문 <span id="count">0</span></h2><button id="clear" class="text-button">전체 비우기</button></div><fieldset><legend>이용 방법</legend><label><input type="radio" name="service" value="매장" checked> 매장에서</label><label><input type="radio" name="service" value="포장"> 포장할게요</label></fieldset><div id="cart" class="cart"></div><div class="checkout"><div class="total"><span>총 주문 금액</span><strong id="total">0원</strong></div><p>메뉴와 수량을 확인한 후 결제를 진행해주세요.</p><button class="primary" id="pay" disabled>결제하기 →</button><small>안심하고 연습하세요. 실제 금액은 청구되지 않습니다.</small></div></aside></main>
<footer>moment café <span>좋은 하루는 작은 순간에서 시작됩니다.</span></footer>
<dialog id="payment"><form method="dialog"><button class="close" aria-label="닫기">×</button></form><div id="payment-content"></div></dialog><div id="announcement" class="sr-only" role="status" aria-live="polite"></div><script type="module" src="app.js"></script></body></html>
